[package]
name = "timelock"
version = "0.3.0"
authors = ["Kevin Johnson <kevin@kj800x.com>"]
edition = "2021"

[dependencies]
cached = "0.54.0"
clap = { version = "4.5.23", features = ["derive"] }
ctrlc = "3.4.5"
hex = "0.4.3"
linreg = "0.2.0"
rand = "0.8.5"
rand_chacha = "0.3.1"
rand_core = "0.6.4"
rust-crypto = "0.2.36"
timeago = "0.4.2"
radix_fmt = "1.0.0"
rsa = { version = "0.9.7", features = ["serde"] }
aes-stream = "0.2.1"
uuid = { version = "1.11.1", features = ["v4"] }

[dev-dependencies]
assert_cmd = "2.0.14"
assert_fs = "1.1.1"
predicates = "3.1.0"
